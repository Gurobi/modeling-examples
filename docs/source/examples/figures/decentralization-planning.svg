    <rect x="260" y="148" width="80" height="40" rx="6"/>
    <rect x="460" y="148" width="80" height="40" rx="6"/>
    <rect x="360" y="200" width="80" height="40" rx="6"/>
    <rect x="460" y="200" width="80" height="40" rx="6"/>
    <rect x="260" y="252" width="80" height="40" rx="6"/>
    <rect x="360" y="252" width="80" height="40" rx="6"/>
    <rect x="260" y="304" width="80" height="40" rx="6"/>
    <rect x="460" y="304" width="80" height="40" rx="6"/>
  </g>
  <g fill="#2f6fb0">
    <rect x="260" y="96" width="80" height="40" rx="6"/>
    <rect x="360" y="148" width="80" height="40" rx="6"/>
    <rect x="260" y="200" width="80" height="40" rx="6"/>
    <rect x="460" y="252" width="80" height="40" rx="6"/>
    <rect x="360" y="304" width="80" height="40" rx="6"/>
